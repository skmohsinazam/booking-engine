<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBook Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'book_appointment' %}">
                <i class="bi bi-calendar-check text-primary me-2"></i>QuickBook
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'book_appointment' %}" class="btn btn-outline-light btn-sm">Book Slot</a>
                <a href="{% url 'staff_dashboard' %}" class="btn btn-primary btn-sm">Staff Dashboard</a>

                {% if user.is_authenticated and user.is_staff %}
                    <div class="d-flex align-items-center gap-1 ms-2">
                        {% if user.is_superuser %}
                            <span class="badge bg-danger text-uppercase">Admin</span>
                        {% else %}
                            <span class="badge bg-info text-dark text-uppercase">Staff</span>
                        {% endif %}
                        <span class="text-white-50 small me-2">{{ user.username }}</span>
                    </div>

                    <form method="POST" action="{% url 'staff_logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

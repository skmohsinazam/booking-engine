{% extends 'bookings/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white py-3 text-center border-0">
                <i class="bi bi-shield-lock-fill text-primary" style="font-size: 2.2rem;"></i>
                <h4 class="fw-bold mb-1 mt-2">Staff Portal Login</h4>
                <p class="text-muted small mb-0">Authorized personnel only</p>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger py-2 small">
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" autofocus required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            Sign In to Dashboard
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
